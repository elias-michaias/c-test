name: CI

on:
  push:
  pull_request:

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TCC
        run: sudo apt-get install -y tcc

      - name: Test (GCC)
        run: make run gcc RUNNER_ARGS=--no-error

      - name: Test (Clang)
        run: make run clang RUNNER_ARGS=--no-error

      - name: Test (TCC)
        run: make run tcc RUNNER_ARGS=--no-error

  # ── macOS ────────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test (Clang)
        run: make run clang RUNNER_ARGS=--no-error

  # ── Windows (MSVC) ───────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build (MSVC)
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory dist | Out-Null
          cl /W3 /nologo /D_CRT_SECURE_NO_WARNINGS ctest.c /Fo:dist\ /Fe:dist\c-test.exe
          foreach ($src in Get-ChildItem test\*.c) {
            $name = $src.BaseName
            Write-Host "  cl $name"
            cl /W3 /nologo /D_CRT_SECURE_NO_WARNINGS /I. /DCTEST $src /Fo:dist\ /Fe:dist\$name.exe
          }

      - name: Test (MSVC)
        shell: pwsh
        run: |
          $bins = Get-ChildItem test\*.c | ForEach-Object { "dist\$($_.BaseName).exe" }
          & dist\c-test.exe --no-error @bins
